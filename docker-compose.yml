version: '3.9'

services:
  # ── PostgreSQL ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: hob_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-house_of_business}
      POSTGRES_USER:     ${DB_USER:-hob_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hob_user} -d ${DB_NAME:-house_of_business}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (Cache) ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: hob_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (Node.js / Express) ───────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hob_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV:          production
      PORT:              3000
      DATABASE_URL:      postgresql://${DB_USER:-hob_user}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-house_of_business}
      DB_HOST:           postgres
      DB_PORT:           5432
      DB_NAME:           ${DB_NAME:-house_of_business}
      DB_USER:           ${DB_USER:-hob_user}
      DB_PASSWORD:       ${DB_PASSWORD}
      JWT_SECRET:        ${JWT_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SMTP_HOST:         ${SMTP_HOST:-}
      SMTP_PORT:         ${SMTP_PORT:-587}
      SMTP_USER:         ${SMTP_USER:-}
      SMTP_PASS:         ${SMTP_PASSWORD:-}
      SMTP_FROM:         ${SMTP_FROM:-noreply@houseofbusiness.co.il}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN:  ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE:       ${TWILIO_PHONE_NUMBER:-}
      FIREBASE_PROJECT_ID:    ${FIREBASE_PROJECT_ID:-}
      FIREBASE_PRIVATE_KEY:   ${FIREBASE_PRIVATE_KEY:-}
      FIREBASE_CLIENT_EMAIL:  ${FIREBASE_CLIENT_EMAIL:-}
      REDIS_URL:              redis://redis:6379
      APP_URL:                ${APP_URL}
      ALLOWED_ORIGINS:        ${ALLOWED_ORIGINS}
      BACKEND_URL:            ${BACKEND_URL}
      ADMIN_ORIGIN:           ${ADMIN_ORIGIN}
      QR_SECRET:              ${QR_SECRET:-}
      CONVERSATION_ENCRYPT_KEY: ${CONVERSATION_ENCRYPT_KEY:-}
      REVALIDATE_SECRET:      ${REVALIDATE_SECRET:-}
      WEBSITE_URL:            ${WEBSITE_URL:-}
      SENTRY_DSN:             ${SENTRY_DSN:-}
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs

  # ── Automated DB Backups ───────────────────────────────────────
  # Daily pg_dump with day/week/month rotation, gzip-compressed. Writes to
  # ./backups on the HOST (bind mount, not a named volume) so backups
  # survive `docker compose down -v` and can be rsynced offsite — a named
  # volume would be wiped by the same command that's used to reset the
  # dev stack. RUNBOOK.md's "Backup & Restore" section documents restoring
  # from these exact files.
  backup:
    image: prodrigestivill/postgres-backup-local:16
    container_name: hob_backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST:     postgres
      POSTGRES_DB:       ${DB_NAME:-house_of_business}
      POSTGRES_USER:     ${DB_USER:-hob_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      SCHEDULE:            "${BACKUP_SCHEDULE:-0 3 * * *}"
      BACKUP_KEEP_DAYS:    "${BACKUP_KEEP_DAYS:-14}"
      BACKUP_KEEP_WEEKS:   "${BACKUP_KEEP_WEEKS:-8}"
      BACKUP_KEEP_MONTHS:  "${BACKUP_KEEP_MONTHS:-6}"
    volumes:
      - ./backups:/backups

  # ── Frontend (Next.js) ────────────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL:     ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
        NEXT_PUBLIC_WEBSITE_URL: ${NEXT_PUBLIC_WEBSITE_URL:-http://localhost:4000}
    container_name: hob_web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}

  # ── Nginx (Reverse Proxy + SSL) ───────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: hob_nginx
    restart: unless-stopped
    depends_on:
      - backend
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_data:/var/www/certbot:ro
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  # ── Certbot (SSL אוטומטי) ─────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: hob_certbot
    volumes:
      - ./nginx/ssl:/etc/letsencrypt
      - certbot_data:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
  uploads_data:
  logs_data:
  certbot_data:
  redis_data:
