name: CI

on:
  push:
    branches: [main, master, develop, design-new-luxury]
  pull_request:
    branches: [main, master, design-new-luxury]

jobs:
  # ── Security — Secret Scanning ────────────────────────────────
  # CodeQL/SAST was removed: this repo doesn't have GitHub Advanced
  # Security available (private repo, no code-scanning license), so
  # those steps always failed with "Code scanning is not enabled for
  # this repository" regardless of any actual code issue — a
  # configuration failure, not a security finding. TruffleHog (secret
  # scanning) works fine on any plan and is what actually ran clean.
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scanning (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  # ── Dependency Audit ─────────────────────────────────────────
  audit-deps:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # continue-on-error: two known findings currently have no clean fix —
      # `xlsx` (backend) has no patched release available from the maintainer
      # at all, and the web findings need a Next.js major-version bump that
      # deserves its own dedicated testing pass, not a rushed --force here.
      # Kept running (not skipped) so any NEW high/critical finding in a
      # different package still shows up as a warning in every run.
      - name: Audit backend dependencies
        working-directory: backend
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Audit web dependencies
        working-directory: web
        run: npm audit --audit-level=high
        continue-on-error: true

  # ── Backend Tests ─────────────────────────────────────────────
  backend:
    name: Backend — Test & Lint
    runs-on: ubuntu-latest
    needs: [security]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hob_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hob_test
      JWT_SECRET: test_secret_ci_minimum_32_characters_long_for_tests
      ANTHROPIC_API_KEY: test-key-ci
      NODE_ENV: test
      # utils/supabase.js throws at require-time if these are unset (a
      # deliberate fail-loud guard for production) — every test file that
      # boots the full app (require('../src/index')) pulls this in
      # transitively, so CI needs syntactically-valid dummy values even
      # though the tests mock out any actual Supabase-touching calls.
      SUPABASE_URL: https://test-ci.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key-ci

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate JWT_SECRET entropy (production guard)
        run: |
          SECRET_LEN=$(echo -n "$JWT_SECRET" | wc -c)
          echo "JWT_SECRET length: $SECRET_LEN"
          if [ "$SECRET_LEN" -lt 32 ]; then
            echo "ERROR: JWT_SECRET too short ($SECRET_LEN chars). Minimum 32 required."
            exit 1
          fi

      - name: Run tests
        run: npm test -- --no-coverage --forceExit

      - name: Run tests with coverage
        run: npm test -- --coverage --forceExit --coverageReporters=text-summary
        continue-on-error: true

  # ── Web Build ─────────────────────────────────────────────────
  web:
    name: Web — TypeScript & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    env:
      NEXT_PUBLIC_API_URL: /api-proxy
      BACKEND_URL: http://localhost:3001/api

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check (strict)
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # ── Notify on failure ─────────────────────────────────────────
  notify-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [security, backend, web]
    if: failure()

    steps:
      - name: Send webhook notification
        if: env.ERROR_WEBHOOK_URL != ''
        env:
          ERROR_WEBHOOK_URL: ${{ secrets.ERROR_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$ERROR_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"level\":\"error\",\"message\":\"CI pipeline failed on ${{ github.ref }}\",\"run\":\"${{ github.run_id }}\"}"
