events {
  worker_connections 1024;
}

http {
  # ── Security headers ────────────────────────────────────────
  add_header X-Frame-Options        "SAMEORIGIN"    always;
  add_header X-Content-Type-Options "nosniff"       always;
  add_header X-XSS-Protection       "1; mode=block" always;

  # ── Gzip ────────────────────────────────────────────────────
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
  gzip_min_length 1000;

  # ── Rate limiting ────────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

  # ── HTTP → HTTPS redirect ────────────────────────────────────
  server {
    listen 80;
    server_name _;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── פלטפורמה: app.houseofbusiness.co.il ─────────────────────
  server {
    listen 443 ssl;
    server_name app.houseofbusiness.co.il;

    ssl_certificate     /etc/letsencrypt/live/app.houseofbusiness.co.il/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.houseofbusiness.co.il/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;

    client_max_body_size 20M;

    # ── SSE (Real-time) — חייב לפני /api/ ────────────────────
    location /api/events {
      proxy_pass             http://localhost:3001;
      proxy_http_version     1.1;
      proxy_set_header       Connection '';
      proxy_buffering        off;
      proxy_cache            off;
      proxy_read_timeout     3600s;
      proxy_set_header       Host $host;
      proxy_set_header       X-Real-IP $remote_addr;
    }

    # ── API → Backend (3001) ──────────────────────────────────
    location /api/ {
      limit_req zone=api burst=50 nodelay;
      proxy_pass         http://localhost:3001;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Web App → Next.js (3002) ──────────────────────────────
    location / {
      proxy_pass         http://localhost:3002;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection 'upgrade';
      proxy_set_header   Host $host;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }
  }

  # ── אתר שיווקי: houseofbusiness.co.il ────────────────────────
  server {
    listen 443 ssl;
    server_name houseofbusiness.co.il www.houseofbusiness.co.il;

    ssl_certificate     /etc/letsencrypt/live/houseofbusiness.co.il/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/houseofbusiness.co.il/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;

    client_max_body_size 5M;

    # www → non-www
    if ($host = www.houseofbusiness.co.il) {
      return 301 https://houseofbusiness.co.il$request_uri;
    }

    location / {
      proxy_pass         http://localhost:4000;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection 'upgrade';
      proxy_set_header   Host $host;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }
  }
}
